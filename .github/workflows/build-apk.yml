name: Build LX Music Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境 (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安裝專案依賴庫
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --legacy-peer-deps

      - name: 生成臨時簽名金鑰配置
        run: |
          cd android
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=lxmusic, OU=app, O=lx, L=City, ST=State, C=CN"
          cat <<EOF > keystore.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=my-key-alias
          storeFile=release.keystore
          EOF

      - name: 開始編譯 Android APK
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          ./gradlew assembleRelease --no-daemon

      - name: 上傳打包好的 APK 產物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LXMusic-Android-Release
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 7
