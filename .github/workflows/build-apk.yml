name: Build LX Music Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境 (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 安裝專案依賴庫
        run: npm install --legacy-peer-deps

      - name: 開始編譯 Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上傳打包好的 APK 產物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LXMusic-Android-Release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
